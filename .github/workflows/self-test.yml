name: Self-test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

# A new push to a pull request stops the old run. A run that started on main always finishes.
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan this repository
    uses: ./.github/workflows/scan.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # The canary has issues on purpose: Semgrep skips it here, Grype skips it in .grype.yaml.
      # Its Dockerfiles are the only Dockerfiles in the repository.
      skip: dockerfiles,image
      semgrep-args: --exclude=canary

  scripts:
    name: Lint the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint and type check Python
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen ty check

      - name: Test the scripts
        run: uv run --frozen python -m unittest discover -s scripts

      - name: Check the shell script
        run: shellcheck scripts/bootstrap.sh

  canary:
    name: Canary
    uses: ./.github/workflows/scan.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      path: canary
      enforce: false
      upload-sarif: false
      report-name: canary

  gitlab:
    name: GitLab component catches the canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Report-only mode turns findings into exit code 2.
      - name: Run the component jobs on the canary
        run: >-
          uv run --frozen scripts/run_gitlab_component.py canary --input enforce=false --expect 2
          --keep-reports "$RUNNER_TEMP/reports"

      - name: Check the expected canary findings
        run: uv run --frozen scripts/check_canary.py gitlab "$RUNNER_TEMP/reports"

  assert:
    name: Every scanner catches the canary
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Download the canary reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - name: Check the expected canary findings
        run: uv run --frozen scripts/check_canary.py github "$RUNNER_TEMP/reports"

      - name: Check that every check blocks on the canary
        env:
          FINDINGS: ${{ toJSON(needs.canary.outputs) }}
        run: |
          set -euo pipefail
          jq . <<< "$FINDINGS"
          blind=$(jq -r '[to_entries[] | select((.value // "") == "" or .value == "0") | .key] | join(", ")' <<< "$FINDINGS")
          if [[ -n "$blind" ]]; then
            echo "::error title=Canary::No findings from: $blind. A scanner update broke detection."
            exit 1
          fi
