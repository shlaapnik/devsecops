spec:
  inputs:
    stage:
      description: Stage of the DevSecOps jobs. Jobs use needs, so the stage only has to exist.
      default: test
    path:
      description: Directory to scan, relative to the project root.
      default: .
    enforce:
      description: Fail on blocking findings. With false the jobs pass with a warning instead.
      type: boolean
      default: true
    skip:
      description: "Comma-separated checks to skip: secrets, ci, sast, deps, dockerfiles, image."
      default: ""
    fail-on-severity:
      description: Lowest severity of a fixable vulnerability that blocks.
      default: high
      options: [low, medium, high, critical]
    secrets-confidence:
      description: Lowest Betterleaks confidence that is reported.
      default: medium
      options: [low, medium, high]
    semgrep-config:
      description: Space-separated Semgrep rulesets. A .semgrep directory in the project is added automatically.
      default: p/default
    semgrep-args:
      description: Extra Semgrep arguments, for example "--exclude-rule <rule-id>".
      default: ""
    dockerfile:
      description: Dockerfile of the image check, relative to path.
      default: Dockerfile
    docker-context:
      description: Build context of the image check, relative to path.
      default: .
    merge-request-pipelines:
      description: >-
        Set true if the project runs merge request pipelines. By default the jobs run in branch pipelines
        only, so the include never adds merge request pipelines to a project.
      type: boolean
      default: false
---
# Exit codes of every scan job: 0 clean, 1 blocking findings, 2 findings in report-only mode or
# changed exception files (shown as a warning), 3 the scanner itself failed.

.devsecops-base:
  stage: $[[ inputs.stage ]]
  needs: []
  interruptible: true
  allow_failure:
    exit_codes: [2]
  variables:
    DEVSECOPS_PATH: "$[[ inputs.path ]]"
    DEVSECOPS_ENFORCE: "$[[ inputs.enforce ]]"
    DEVSECOPS_SKIP: "$[[ inputs.skip ]]"
    DEVSECOPS_FAIL_ON: "$[[ inputs.fail-on-severity ]]"
    DEVSECOPS_MR_PIPELINES: "$[[ inputs.merge-request-pipelines ]]"
    DEVSECOPS_REPORTS: $CI_PROJECT_DIR/devsecops-reports
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - devsecops-reports/

# Branch pipelines by default. A rule that matches every pipeline source would add a merge request
# pipeline with only these jobs, and that pipeline would then gate the merge request.
.devsecops-rules:
  rules:
    - if: $DEVSECOPS_MR_PIPELINES == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $DEVSECOPS_MR_PIPELINES == "true" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.devsecops-finish:
  script:
    - |
      if [ "${DEVSECOPS_FOUND:-0}" != "0" ]; then
        if [ "$DEVSECOPS_ENFORCE" = "true" ]; then
          echo "DevSecOps: blocking findings, see the log above and the reports in the job artifacts."
          exit 1
        fi
        echo "DevSecOps: findings reported as a warning because enforce is false."
        exit 2
      fi
      if [ "${DEVSECOPS_EXCEPTIONS_CHANGED:-0}" != "0" ]; then
        echo "DevSecOps: exception files changed, review them before merging."
        exit 2
      fi

devsecops-secrets:
  extends: .devsecops-base
  image:
    name: ghcr.io/betterleaks/betterleaks:v1.10.1@sha256:f345c1ac502abc51ec334c3d815ad18a79fb1509555fc4496b2cb88e760681b3
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    DEVSECOPS_SECRETS_CONFIDENCE: "$[[ inputs.secrets-confidence ]]"
  rules:
    - if: $DEVSECOPS_SKIP =~ /secrets/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - mkdir -p "$DEVSECOPS_REPORTS"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      # Inline gitleaks:allow comments are ignored: exceptions live in reviewed files, not next to the code.
      set -- --no-banner --no-color --redact --exit-code 3 --confidence "$DEVSECOPS_SECRETS_CONFIDENCE" --ignore-gitleaks-allow \
        --max-target-megabytes 10 --report-format sarif --report-path "$DEVSECOPS_REPORTS/betterleaks.sarif"
      for config in .betterleaks.toml .gitleaks.toml; do
        if [ -f "$config" ]; then
          set -- "$@" --config "$config"
          break
        fi
      done
      if [ -f .devsecops/betterleaks-baseline.json ]; then
        set -- "$@" --baseline-path .devsecops/betterleaks-baseline.json
      fi
      # The whole git history at the project root, the working tree in a subdirectory.
      mode=dir
      if [ "$DEVSECOPS_PATH" = "." ]; then
        mode=git
      fi
      status=0
      betterleaks "$mode" "$@" . || status=$?
      case "$status" in
        0) DEVSECOPS_FOUND=0 ;;
        3) DEVSECOPS_FOUND=1 ;;
        *) echo "Betterleaks exited with code $status"; exit 3 ;;
      esac
    - |
      # An agent that wants a green pipeline edits these first, so a human should look.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ] && [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] \
        && git fetch --quiet origin "$CI_DEFAULT_BRANCH" 2>/dev/null; then
        base=$(git merge-base FETCH_HEAD HEAD 2>/dev/null || true)
      fi
      if [ -n "$base" ]; then
        changed=$({
          git diff --name-only "$base" HEAD -- \
            .betterleaksignore .gitleaksignore .betterleaks.toml .gitleaks.toml .semgrepignore .semgrep \
            .grype.yaml .grype.yml .grype .hadolint.yaml .hadolint.yml .poutine.yml .github/poutine.yml .devsecops
          # The CI configuration can turn checks off.
          git -C "$CI_PROJECT_DIR" diff --name-only \
            -G 'enforce|skip|fail-on-severity|secrets-confidence|semgrep-config|semgrep-args' \
            "$base" HEAD -- "$CI_CONFIG_PATH"
        } | sort -u)
        if [ -n "$changed" ]; then
          echo "Exceptions or pipeline settings changed in this branch:"
          echo "$changed" | sed 's/^/  - /'
          DEVSECOPS_EXCEPTIONS_CHANGED=1
        fi
      fi
    - !reference [.devsecops-finish, script]

devsecops-ci:
  extends: .devsecops-base
  image:
    name: ghcr.io/boostsecurityio/poutine:1.1.6@sha256:722a8e0999b583c1540fe2974e691032b2d9d21b9256a17965132b6bfd0081b0
    entrypoint: [""]
  rules:
    - if: $DEVSECOPS_SKIP =~ /ci/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$DEVSECOPS_REPORTS"
    # CI configuration belongs to the whole project, so this check ignores path.
    - cd "$CI_PROJECT_DIR"
    - |
      DEVSECOPS_FOUND=0
      if [ -f .gitlab-ci.yml ]; then
        set -- analyze_local . --scm gitlab --scm-base-url "$CI_SERVER_URL" --quiet --disable-version-check
        status=0
        poutine "$@" --fail-on-violation --format sarif > "$DEVSECOPS_REPORTS/poutine.sarif" || status=$?
        case "$status" in
          0) ;;
          10) DEVSECOPS_FOUND=1; poutine "$@" --format pretty ;;
          *) echo "poutine exited with code $status"; exit 3 ;;
        esac
      else
        echo "No .gitlab-ci.yml here, nothing to audit"
      fi
    - !reference [.devsecops-finish, script]

devsecops-sast:
  extends: .devsecops-base
  image:
    name: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    entrypoint: [""]
  variables:
    DEVSECOPS_SEMGREP_CONFIG: "$[[ inputs.semgrep-config ]]"
    DEVSECOPS_SEMGREP_ARGS: "$[[ inputs.semgrep-args ]]"
  rules:
    - if: $DEVSECOPS_SKIP =~ /sast/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$DEVSECOPS_REPORTS"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      # Inline nosemgrep comments are ignored: exceptions live in reviewed files, not next to the code.
      set -- scan --metrics=off --disable-nosem \
        --sarif-output="$DEVSECOPS_REPORTS/semgrep.sarif" --gitlab-sast-output="$DEVSECOPS_REPORTS/gl-sast-report.json"
      for config in $DEVSECOPS_SEMGREP_CONFIG; do
        set -- "$@" --config "$config"
      done
      if [ -d .semgrep ]; then
        set -- "$@" --config .semgrep
      fi
      # shellcheck disable=SC2086 # extra arguments are meant to be split
      semgrep "$@" $DEVSECOPS_SEMGREP_ARGS . || { echo "Semgrep failed"; exit 3; }
      # SARIF keeps the severity on the rule, so ERROR-level rules are the blocking ones.
      blocking=$(jq '
        (.runs[0].tool.driver.rules | map({(.id): (.defaultConfiguration.level // "warning")}) | add // {}) as $level
        | [.runs[0].results[] | select((.level // $level[.ruleId]) == "error")] | length
      ' "$DEVSECOPS_REPORTS/semgrep.sarif")
      echo "Blocking (ERROR) findings: $blocking"
      DEVSECOPS_FOUND=$blocking
    - !reference [.devsecops-finish, script]
  artifacts:
    reports:
      sast: devsecops-reports/gl-sast-report.json

devsecops-deps:
  extends: .devsecops-base
  image:
    name: anchore/grype:v0.121.3-debug@sha256:09301bc98ed5eba53b9c5f56cb0f7d4637a9cece469c9feae9e64624a6a31e8c
    entrypoint: [""]
  rules:
    - if: $DEVSECOPS_SKIP =~ /deps/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$DEVSECOPS_REPORTS"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      # Only vulnerabilities with a fix: anything else cannot be solved by an update.
      # Grype reads .grype.yaml from the scanned directory for reviewed ignores.
      status=0
      /grype dir:. --only-fixed --fail-on "$DEVSECOPS_FAIL_ON" --output table \
        --output sarif="$DEVSECOPS_REPORTS/grype-source.sarif" --output cyclonedx-json="$DEVSECOPS_REPORTS/gl-sbom-source.cdx.json" \
        || status=$?
      case "$status" in
        0) DEVSECOPS_FOUND=0 ;;
        2) DEVSECOPS_FOUND=1 ;;
        *) echo "Grype exited with code $status"; exit 3 ;;
      esac
    - !reference [.devsecops-finish, script]
  artifacts:
    reports:
      cyclonedx: devsecops-reports/gl-sbom-source.cdx.json

devsecops-dockerfiles:
  extends: .devsecops-base
  image:
    name: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    entrypoint: [""]
  rules:
    - if: $DEVSECOPS_SKIP =~ /dockerfiles/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$DEVSECOPS_REPORTS"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      DEVSECOPS_FOUND=0
      files=$(find . -type f \
        \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' -o -name '*.dockerfile' -o -name Containerfile \) \
        ! -path './.git/*' ! -path '*/node_modules/*' | sort)
      if [ -n "$files" ]; then
        set -f
        # shellcheck disable=SC2086 # one file per word
        set -- --disable-ignore-pragma $files
        set +f
        # hadolint reads .hadolint.yaml from the scanned directory. Inline ignore comments are ignored.
        hadolint --no-fail --format sarif "$@" > "$DEVSECOPS_REPORTS/hadolint.sarif"
        hadolint --no-fail --format gitlab_codeclimate "$@" > "$DEVSECOPS_REPORTS/gl-code-quality-hadolint.json"
        status=0
        hadolint --failure-threshold error --no-color "$@" || status=$?
        case "$status" in
          0) ;;
          1) DEVSECOPS_FOUND=1 ;;
          *) echo "hadolint exited with code $status"; exit 3 ;;
        esac
      else
        echo "No Dockerfiles here"
      fi
    - !reference [.devsecops-finish, script]
  artifacts:
    reports:
      codequality: devsecops-reports/gl-code-quality-hadolint.json

devsecops-image-build:
  extends: .devsecops-base
  # kaniko builds without privileges or a Docker daemon, so it runs on any runner.
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.2-debug@sha256:b3cadc638a5b0a7e8ae7b3b76704821b2b5f191163222da401283541c8fa2d41
    entrypoint: [""]
  variables:
    DEVSECOPS_DOCKERFILE: "$[[ inputs.dockerfile ]]"
    DEVSECOPS_DOCKER_CONTEXT: "$[[ inputs.docker-context ]]"
  # A build downloads base images and packages, and a network failure fails it like a real error.
  # A new try gets a clean container, because kaniko builds inside its own file system.
  retry:
    max: 2
    when: script_failure
  rules:
    - if: $DEVSECOPS_SKIP =~ /image/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$CI_PROJECT_DIR/devsecops-image"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      if [ -f "$DEVSECOPS_DOCKERFILE" ]; then
        /kaniko/executor --context "dir://$PWD/$DEVSECOPS_DOCKER_CONTEXT" --dockerfile "$PWD/$DEVSECOPS_DOCKERFILE" \
          --no-push --destination devsecops-scan:local --tar-path "$CI_PROJECT_DIR/devsecops-image/image.tar"
      else
        echo "No $DEVSECOPS_DOCKERFILE here, nothing to build"
      fi
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - devsecops-image/

devsecops-image:
  extends: .devsecops-base
  image:
    name: anchore/grype:v0.121.3-debug@sha256:09301bc98ed5eba53b9c5f56cb0f7d4637a9cece469c9feae9e64624a6a31e8c
    entrypoint: [""]
  needs:
    - job: devsecops-image-build
      artifacts: true
      optional: true
  rules:
    - if: $DEVSECOPS_SKIP =~ /image/
      when: never
    - !reference [.devsecops-rules, rules]
  script:
    - mkdir -p "$DEVSECOPS_REPORTS"
    - cd "$CI_PROJECT_DIR/$DEVSECOPS_PATH"
    - |
      DEVSECOPS_FOUND=0
      archive="$CI_PROJECT_DIR/devsecops-image/image.tar"
      if [ -f "$archive" ]; then
        status=0
        /grype "docker-archive:$archive" --only-fixed --fail-on "$DEVSECOPS_FAIL_ON" --output table \
          --output sarif="$DEVSECOPS_REPORTS/grype-image.sarif" --output cyclonedx-json="$DEVSECOPS_REPORTS/gl-sbom-image.cdx.json" \
          || status=$?
        case "$status" in
          0) ;;
          2) DEVSECOPS_FOUND=1 ;;
          *) echo "Grype exited with code $status"; exit 3 ;;
        esac
      else
        echo "No image was built"
      fi
    - !reference [.devsecops-finish, script]
  artifacts:
    reports:
      cyclonedx: devsecops-reports/gl-sbom-image.cdx.json
