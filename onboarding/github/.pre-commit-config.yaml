# Security hooks. Merge them into an existing .pre-commit-config.yaml, Renovate keeps the revs current.
repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.0
    hooks:
      - id: betterleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
